<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<title>Login — Good for You Test Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>

/* ── RESET BODY FOR AUTH ── */
body {
  background: var(--ivory);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── TOP NAV BAR ── */
.auth-navbar {
  height: 58px;
  background: var(--green);
  border-bottom: 2px solid rgba(184,150,46,.45);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 10px;
  flex-shrink: 0;
  box-shadow: 0 2px 12px rgba(0,0,0,.14);
}
.auth-navbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.auth-navbar-icon {
  width: 34px; height: 34px;
  background: rgba(255,255,255,.1);
  border: 1.5px solid rgba(212,175,80,.4);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.auth-navbar-name {
  font-family: 'Libre Baskerville', serif;
  font-size: .9rem; font-weight: 700;
  color: #fff; line-height: 1;
}
.auth-navbar-name em { font-style: italic; color: #D4AF50; }
.auth-navbar-sep {
  width: 1px; height: 18px;
  background: rgba(255,255,255,.15);
  margin-left: auto;
}
.auth-navbar-link {
  font-size: .76rem; color: rgba(255,255,255,.6);
  text-decoration: none; font-weight: 500;
  padding: 6px 12px; border-radius: 4px;
  transition: color .2s, background .2s;
  margin-left: 8px;
}
.auth-navbar-link:hover { color: #fff; background: rgba(255,255,255,.08); }
.auth-navbar-cta {
  font-size: .76rem; font-weight: 700;
  background: rgba(212,175,80,.18);
  border: 1px solid rgba(212,175,80,.35);
  color: #D4AF50;
  padding: 6px 16px; border-radius: 4px;
  text-decoration: none;
  transition: all .2s;
  margin-left: 6px;
}
.auth-navbar-cta:hover { background: rgba(212,175,80,.28); border-color: rgba(212,175,80,.6); color: #E8C97A; }

/* ── PAGE BODY ── */
.auth-page {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 20px;
  position: relative;
  overflow: hidden;
}

/* Subtle ivory background pattern */
.auth-page::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(var(--ivory-3) 1px, transparent 1px),
    linear-gradient(90deg, var(--ivory-3) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: .45;
  pointer-events: none;
}

/* ── AUTH CARD ── */
.auth-card {
  position: relative; z-index: 1;
  width: 100%; max-width: 440px;
  background: #fff;
  border: 1.5px solid var(--ivory-3);
  box-shadow:
    0 1px 3px rgba(0,0,0,.04),
    0 8px 32px rgba(0,0,0,.07),
    0 24px 64px rgba(0,0,0,.06);
  animation: fadeUp .5s ease both;
  overflow: hidden;
}

/* Green top accent strip */
.auth-card-accent {
  height: 4px;
  background: linear-gradient(90deg, var(--green) 0%, var(--green-lt) 60%, rgba(212,175,80,.6) 100%);
}

.auth-card-body {
  padding: 40px 40px 36px;
}
@media(max-width: 480px) {
  .auth-card-body { padding: 32px 24px 28px; }
}

/* ── CARD HEADER ── */
.auth-card-header {
  text-align: center;
  margin-bottom: 32px;
  padding-bottom: 28px;
  border-bottom: 1px solid var(--ivory-2);
}
.auth-logo-circle {
  width: 52px; height: 52px;
  background: var(--green);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px;
  box-shadow: 0 4px 16px rgba(26,74,46,.22);
}
.auth-card-title {
  font-family: 'Libre Baskerville', serif;
  font-size: 1.45rem; font-weight: 700;
  color: var(--green-dim); margin-bottom: 6px;
  line-height: 1.2;
}
.auth-card-title em { font-style: italic; color: var(--green); }
.auth-card-sub {
  font-size: .82rem; color: var(--muted); line-height: 1.55;
}

/* ── MESSAGES ── */
.auth-alert {
  display: none;
  align-items: flex-start;
  gap: 10px;
  padding: 11px 14px;
  border-radius: 6px;
  font-size: .82rem;
  font-weight: 500;
  line-height: 1.5;
  margin-bottom: 20px;
}
.auth-alert.error {
  background: rgba(185,28,28,.05);
  border: 1px solid rgba(185,28,28,.2);
  border-left: 3px solid #DC2626;
  color: #B91C1C;
}
.auth-alert.success {
  background: rgba(26,74,46,.05);
  border: 1px solid rgba(26,74,46,.18);
  border-left: 3px solid var(--green);
  color: var(--green);
}
.auth-alert svg { flex-shrink: 0; margin-top: 1px; }

/* ── FORM FIELDS ── */
.field { margin-bottom: 18px; }

.field-label {
  display: block;
  font-size: .7rem;
  font-weight: 700;
  color: var(--text-mid);
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-bottom: 7px;
}

.field-input {
  width: 100%;
  padding: 11px 14px;
  background: var(--ivory);
  border: 1.5px solid var(--ivory-3);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: .9rem;
  border-radius: 6px;
  transition: border-color .18s, background .18s, box-shadow .18s;
  -webkit-appearance: none;
}
.field-input:focus {
  outline: none;
  border-color: var(--green);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(26,74,46,.09);
}
.field-input::placeholder { color: var(--faint); }

/* ── SUBMIT BUTTON ── */
.auth-submit {
  width: 100%;
  padding: 13px 20px;
  margin-top: 6px;
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 7px;
  font-family: 'Inter', sans-serif;
  font-size: .92rem;
  font-weight: 700;
  letter-spacing: .02em;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .2s, transform .18s, box-shadow .2s;
  box-shadow: 0 2px 8px rgba(26,74,46,.18);
}
.auth-submit:hover {
  background: var(--green-lt);
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(26,74,46,.24);
}
.auth-submit:active { transform: scale(.98); box-shadow: none; }
.auth-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: none; }

/* ── DIVIDER ── */
.auth-divider {
  display: flex; align-items: center; gap: 12px;
  margin: 22px 0;
  font-size: .7rem; color: var(--faint);
  letter-spacing: .08em; text-transform: uppercase;
}
.auth-divider::before, .auth-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--ivory-3);
}

/* ── FOOTER LINKS ── */
.auth-card-footer {
  text-align: center;
}
.auth-footer-text {
  font-size: .83rem; color: var(--muted); margin-bottom: 10px;
}
.auth-footer-text a {
  color: var(--green); font-weight: 700; text-decoration: none;
}
.auth-footer-text a:hover { text-decoration: underline; }

.auth-back-link {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: .72rem; color: var(--faint); text-decoration: none;
  transition: color .18s;
  margin-top: 4px;
}
.auth-back-link:hover { color: var(--green); }

/* ── PAGE FOOTER ── */
.auth-page-footer {
  text-align: center;
  padding: 20px;
  font-size: .68rem;
  color: var(--faint);
  flex-shrink: 0;
}

</style>
</head>
<body>

<div id="toast-container"></div>

<!-- Top nav -->
<nav class="auth-navbar">
  <a href="index.html" class="auth-navbar-brand">
    <div class="auth-navbar-icon">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#D4AF50" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </div>
    <span class="auth-navbar-name">Good <em>for You</em></span>
  </a>
  <div class="auth-navbar-sep"></div>
  <a href="index.html" class="auth-navbar-link">Home</a>
  <a href="signup.html" class="auth-navbar-cta">Sign Up</a>
</nav>

<!-- Page content -->
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-card-accent"></div>

    <div class="auth-card-body">

      <!-- Header -->
      <div class="auth-card-header">
        <div class="auth-logo-circle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <h1 class="auth-card-title">Welcome back</h1>
        <p class="auth-card-sub">Sign in to your account to continue</p>
      </div>

      <!-- Error / Success alerts -->
      <div class="auth-alert error" id="authError">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="authErrorText"></span>
      </div>
      <div class="auth-alert success" id="authSuccess">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span id="authSuccessText"></span>
      </div>

      <!-- Form fields -->
      <div class="field">
        <label class="field-label" for="loginEmail">Email Address</label>
        <input type="email" class="field-input" id="loginEmail" placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="field">
        <label class="field-label" for="loginPassword">Password</label>
        <input type="password" class="field-input" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
      </div>

      <!-- Submit -->
      <button class="auth-submit" id="loginBtn" onclick="doLogin()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Sign In
      </button>

      <div class="auth-divider">or</div>

      <!-- Footer links -->
      <div class="auth-card-footer">
        <p class="auth-footer-text">Don't have an account? <a href="signup.html">Create one free</a></p>
        <a href="index.html" class="auth-back-link">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Back to Home
        </a>
      </div>

    </div>
  </div>
</div>

<footer class="auth-page-footer">
  &copy; 2026 Good for You Test Engine &middot; All rights reserved
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script>
initFirebase();

firebase.auth().onAuthStateChanged(async u => {
  if (u) window.location.href = 'dashboard.html';
});

function showError(msg) {
  const e = document.getElementById('authError');
  document.getElementById('authErrorText').textContent = msg;
  e.style.display = 'flex';
  document.getElementById('authSuccess').style.display = 'none';
}
function showSuccess(msg) {
  const s = document.getElementById('authSuccess');
  document.getElementById('authSuccessText').textContent = msg;
  s.style.display = 'flex';
  document.getElementById('authError').style.display = 'none';
}
function clearMessages() {
  document.getElementById('authError').style.display = 'none';
  document.getElementById('authSuccess').style.display = 'none';
}

async function doLogin() {
  clearMessages();
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) { showError('Please fill in your email and password.'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="animation:spin .7s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Signing in…`;

  try {
    await firebase.auth().signInWithEmailAndPassword(email, password);
    showSuccess('Login successful! Redirecting…');
    setTimeout(() => window.location.href = 'dashboard.html', 1000);
  } catch(e) {
    const msgs = {
      'auth/user-not-found':    'No account found with this email.',
      'auth/wrong-password':    'Incorrect password.',
      'auth/invalid-email':     'Invalid email format.',
      'auth/too-many-requests': 'Too many attempts. Please try again later.',
    };
    showError(msgs[e.code] || e.message);
    btn.disabled = false;
    btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Sign In`;
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

/* spinner keyframe injected here to avoid CSS duplication */
const st = document.createElement('style');
st.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
document.head.appendChild(st);
</script>
</body>
</html>
