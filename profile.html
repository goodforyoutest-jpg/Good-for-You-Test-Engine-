<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<title>Profile — Good for You Test Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
*, *::before, *::after { -webkit-tap-highlight-color: transparent; }
a, button, [onclick], label, input { -webkit-tap-highlight-color: transparent; outline: none; }

.profile-layout { max-width: 620px; margin: 0 auto; padding: 28px 16px 80px; }

/* ── Hero ── */
.profile-hero {
  background: #fff; border: 1px solid var(--ivory-3);
  border-top: 4px solid var(--green);
  padding: 32px 24px 24px; text-align: center;
  margin-bottom: 14px; position: relative; overflow: hidden;
}
.profile-hero::after {
  content: ''; position: absolute; right: -30px; top: -30px;
  width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle, rgba(26,74,46,.05), transparent);
  pointer-events: none;
}
.profile-avatar {
  width: 82px; height: 82px; border-radius: 50%;
  margin: 0 auto 14px;
  background: linear-gradient(135deg, var(--green), var(--green-lt));
  display: flex; align-items: center; justify-content: center;
  font-family: 'Libre Baskerville', serif; font-size: 2.2rem;
  font-weight: 700; color: #fff;
  border: 3px solid var(--ivory-3);
  box-shadow: 0 6px 24px rgba(26,74,46,.2);
}
.profile-name {
  font-family: 'Libre Baskerville', serif; font-size: 1.45rem;
  font-weight: 700; color: var(--green-dim);
}
.profile-email { font-size: .78rem; color: var(--muted); margin-top: 3px; }
.profile-role {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 10px; padding: 4px 14px;
  background: var(--green-mist); border: 1px solid var(--green-border);
  font-size: .68rem; color: var(--green); font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em;
}
.profile-org {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 8px; padding: 4px 13px;
  background: var(--ivory-2); border: 1px solid var(--ivory-3);
  font-size: .7rem; color: var(--muted);
}
.profile-org strong { color: var(--text); }

/* ── Stats ── */
.profile-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-top: 20px; }
.ps-box {
  background: var(--ivory-2); border: 1px solid var(--ivory-3);
  padding: 12px 6px; text-align: center; border-bottom: 2px solid var(--green);
  transition: border-bottom-color .2s;
}
.ps-box:hover { border-bottom-color: #B8962E; }
.ps-num { font-family: 'Libre Baskerville', serif; font-size: 1.35rem; font-weight: 700; color: var(--green); line-height: 1; }
.ps-lbl { font-size: .57rem; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; margin-top: 4px; }

/* ── Trend Chart ── */
.trend-wrap {
  background: #fff; border: 1px solid var(--ivory-3); margin-bottom: 12px;
}
.card-head {
  padding: 11px 16px; background: var(--ivory-2); border-bottom: 1px solid var(--ivory-3);
  display: flex; align-items: center; justify-content: space-between;
}
.card-head-title {
  font-size: .62rem; color: var(--green); font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase;
}
.card-head-badge {
  font-size: .62rem; background: var(--green-mist); border: 1px solid var(--green-border);
  padding: 2px 10px; color: var(--green); font-weight: 700;
}
.card-body { padding: 16px; }
.chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 80px; }
.chart-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.chart-bar { width: 100%; min-height: 4px; transition: height .4s cubic-bezier(.4,0,.2,1); }
.chart-bar-val { font-size: .56rem; color: var(--muted); white-space: nowrap; }
.chart-bar-lbl { font-size: .55rem; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; text-align: center; }
.no-data { text-align: center; padding: 20px; color: var(--muted); font-size: .8rem; }

/* ── Weakness Bars ── */
.weakness-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.weakness-row:last-child { margin-bottom: 0; }
.weakness-label { font-size: .76rem; color: var(--text-mid); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.weakness-track { flex: 1.5; height: 5px; background: var(--ivory-3); overflow: hidden; }
.weakness-fill  { height: 100%; }
.weakness-pct   { font-size: .7rem; font-weight: 700; min-width: 34px; text-align: right; }

/* ── History ── */
.history-row {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; border-bottom: 1px solid var(--ivory-3);
  cursor: pointer; transition: background .12s;
}
.history-row:last-child { border-bottom: none; }
.history-row:hover { background: var(--green-mist); }
.history-row:active { transform: scale(.99); }
.history-rank {
  width: 32px; height: 32px; flex-shrink: 0;
  background: var(--green-mist); border: 1px solid var(--green-border);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Libre Baskerville', serif; font-size: .8rem; color: var(--green); font-weight: 700;
}
.history-info { flex: 1; min-width: 0; }
.history-title { font-size: .86rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-sub   { font-size: .7rem; color: var(--muted); margin-top: 2px; }
.history-score { font-family: 'Libre Baskerville', serif; font-size: 1.1rem; font-weight: 700; flex-shrink: 0; }

/* ── Account Card ── */
.account-card { background: #fff; border: 1px solid var(--ivory-3); }
.account-body  { padding: 18px; display: flex; flex-direction: column; gap: 12px; }

/* ── Must Read btn ── */
.btn-must-read {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 20px; width: 100%;
  background: #fff; border: 1px solid var(--ivory-3);
  color: var(--text-mid); font-family: 'Inter', sans-serif;
  font-size: .84rem; font-weight: 600; cursor: pointer; transition: all .2s;
  text-decoration: none;
}
.btn-must-read:hover  { background: var(--ivory-2); border-color: var(--green-border); color: var(--green); }
.btn-must-read:active { transform: scale(.97); }

/* ── Report btn ── */
.btn-report {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 20px; width: 100%;
  background: rgba(184,150,46,.06); border: 1px solid rgba(184,150,46,.28);
  color: #996B00; font-family: 'Inter', sans-serif;
  font-size: .84rem; font-weight: 600; cursor: pointer; transition: all .2s;
}
.btn-report:hover  { background: rgba(184,150,46,.13); border-color: #B8962E; }
.btn-report:active { transform: scale(.97); }

@media(max-width:480px) { .profile-stats { grid-template-columns: repeat(2,1fr); } }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="toast-container"></div>

<header class="site-header">
  <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <span class="header-ca-label" id="headerCaLabel">Profile</span>
  <span class="header-pill">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Profile
  </span>
</header>

<div class="page-wrap">
<div class="profile-layout">
  <div id="profileContent">
    <div class="loading-screen"><div class="spinner"></div></div>
  </div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script src="drawer.js"></script>
<script>
initFirebase();
initBgCanvas();
injectDrawer('profile');

/* ── HELPERS ── */
function scoreColor(pct) {
  return pct >= 75 ? 'var(--green)' : pct >= 50 ? '#B8962E' : '#DC2626';
}

/* ── LOAD PROFILE ── */
async function loadProfile() {
  const user = await requireAuth();
  if (!user) return;
  injectHeaderUser();
  populateDrawerUser();

  const doc     = await getUserDoc(user.uid);
  const name    = doc?.username || user.displayName || 'Student';
  const role    = doc?.role     || 'student';
  const orgCode = doc?.orgCode  || null;

  /* org details */
  let orgName = orgCode || '—';
  let orgCourse = '';
  if (orgCode) {
    try {
      const orgSnap = await window.db.collection('organisations').doc(orgCode).get();
      if (orgSnap.exists) {
        orgName   = orgSnap.data().name   || orgCode;
        orgCourse = orgSnap.data().course || '';
      }
    } catch(e) {}
  }

  /* results */
  let results = [];
  if (orgCode) {
    const snap = await window.db.collection('results')
      .where('userId', '==', user.uid)
      .where('orgCode', '==', orgCode)
      .get();

    results = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => {
      const ta = a.createdAt?.toDate?.()?.getTime() || 0;
      const tb = b.createdAt?.toDate?.()?.getTime() || 0;
      return tb - ta;
    });
  }

  const total          = results.length;
  const avg            = total ? Math.round(results.reduce((s,r) => s+(r.percentage||0),0)/total) : 0;
  const best           = total ? Math.max(...results.map(r => r.percentage||0)) : 0;
  const bestResult     = results.find(r => r.percentage === best);
  const totalCorrect   = results.reduce((s,r) => s+(r.correct||0), 0);
  const totalQuestions = results.reduce((s,r) => s+(r.total||0), 0);
  const overallAcc     = totalQuestions ? Math.round(totalCorrect/totalQuestions*100) : 0;

  /* org rank */
  let myRank = '—';
  if (orgCode && total > 0) {
    try {
      const orgRes = await window.db.collection('results').where('orgCode','==',orgCode).limit(500).get();
      const byUser = {};
      orgRes.docs.forEach(d => {
        const r = d.data();
        if (!r.userId) return;
        if (!byUser[r.userId] || (r.percentage||0) > byUser[r.userId]) byUser[r.userId] = r.percentage||0;
      });
      const sorted = Object.values(byUser).sort((a,b) => b-a);
      const myBest = byUser[user.uid];
      if (myBest !== undefined) myRank = '#' + (sorted.indexOf(myBest) + 1);
    } catch(e) {}
  }

  /* section accuracy */
  const secAgg = {};
  results.forEach(r => {
    Object.entries(r.sectionStats||{}).forEach(([sec, stats]) => {
      if (!secAgg[sec]) secAgg[sec] = { c:0, t:0 };
      secAgg[sec].c += stats.c||0;
      secAgg[sec].t += stats.t||0;
    });
  });
  const sections = Object.entries(secAgg)
    .filter(([,v]) => v.t > 0)
    .map(([n, v]) => ({ name: n, pct: Math.round(v.c/v.t*100) }))
    .sort((a,b) => a.pct - b.pct);

  /* last active */
  const lastResult = results[0];
  const lastDate   = lastResult?.createdAt?.toDate?.() || null;
  const daysSince  = lastDate ? Math.floor((Date.now()-lastDate.getTime())/86400000) : null;
  const lastActive = daysSince === null ? '—' : daysSince === 0 ? 'Today' : daysSince === 1 ? 'Yesterday' : daysSince + 'd ago';

  /* trend chart */
  const trendData = [...results].reverse().slice(-8);
  const maxPct    = trendData.length ? Math.max(...trendData.map(r=>r.percentage||0), 1) : 100;
  const trendHtml = trendData.length < 2
    ? '<div class="no-data">Take at least 2 tests to see your score trend.</div>'
    : '<div class="chart-bars">' +
        trendData.map(r => {
          const pct   = r.percentage||0;
          const h     = Math.max(6, Math.round((pct/maxPct)*80));
          const short = (r.testTitle||'').split(' ').slice(0,2).join(' ');
          return '<div class="chart-bar-wrap">' +
            '<div class="chart-bar-val">' + pct + '%</div>' +
            '<div class="chart-bar" style="height:' + h + 'px;background:' + scoreColor(pct) + ';opacity:.85;" title="' + escHtml(r.testTitle||'') + '"></div>' +
            '<div class="chart-bar-lbl">' + escHtml(short) + '</div>' +
          '</div>';
        }).join('') +
      '</div>';

  /* weakness bars */
  const weakHtml = sections.length === 0
    ? '<div class="no-data">No section data yet.</div>'
    : sections.slice(0,6).map(s =>
        '<div class="weakness-row">' +
          '<div class="weakness-label">' + escHtml(s.name) + '</div>' +
          '<div class="weakness-track"><div class="weakness-fill" style="width:' + s.pct + '%;background:' + scoreColor(s.pct) + ';"></div></div>' +
          '<div class="weakness-pct" style="color:' + scoreColor(s.pct) + ';">' + s.pct + '%</div>' +
        '</div>'
      ).join('');

  /* history rows */
  const historyHtml = results.length === 0
    ? '<div class="empty-state"><p>No tests taken yet.</p></div>'
    : results.slice(0,10).map(r => {
        const pct     = r.percentage||0;
        const rank    = r.rank ? '#'+r.rank : '—';
        const dateStr = r.createdAt?.toDate?.() ? formatDate(r.createdAt) : '—';
        return '<div class="history-row" onclick="viewProfileResult(\'' + escHtml(r.id || '') + '\')">' +
          '<div class="history-rank">' + rank + '</div>' +
          '<div class="history-info">' +
            '<div class="history-title">' + escHtml(r.testTitle||'—') + '</div>' +
            '<div class="history-sub">' + (r.correct||0) + '/' + (r.total||0) + ' correct · ' + dateStr + '</div>' +
          '</div>' +
          '<div class="history-score" style="color:' + scoreColor(pct) + ';">' + pct + '%</div>' +
        '</div>';
      }).join('');

  /* org html */
  const orgHtml = orgCode
    ? '<br><div class="profile-org">' +
        '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>' +
        '<strong>' + escHtml(orgName) + '</strong>' + (orgCourse ? ' · '+escHtml(orgCourse) : '') + ' &nbsp;·&nbsp; <code style="letter-spacing:.1em;">' + escHtml(orgCode) + '</code>' +
      '</div>'
    : '';

  /* best badge */
  const bestHtml = bestResult
    ? '<div style="margin-top:14px;font-size:.7rem;color:var(--muted);">Best: <strong style="color:var(--green);">' + best + '%</strong> in <em style="font-style:normal;color:var(--text-mid);">' + escHtml(bestResult.testTitle||'—') + '</em> &nbsp;·&nbsp; Last active: <strong style="color:var(--green);">' + lastActive + '</strong></div>'
    : '';

  /* admin link */
  const adminHtml = (role === 'admin' || role === 'teacher')
    ? '<a href="admin.html" class="btn-secondary" style="text-align:center;text-decoration:none;display:inline-flex;align-items:center;gap:7px;justify-content:center;">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>' +
        'Admin Panel' +
      '</a>'
    : '';

  /* set header */
  document.getElementById('headerCaLabel').textContent = name;

  /* render */
  document.getElementById('profileContent').innerHTML =

    /* ── HERO ── */
    '<div class="profile-hero">' +
      '<div class="profile-avatar">' + name.charAt(0).toUpperCase() + '</div>' +
      '<div class="profile-name">' + escHtml(name) + '</div>' +
      '<div class="profile-email">' + escHtml(user.email||'—') + '</div>' +
      '<div class="profile-role">' +
        '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' +
        role +
      '</div>' +
      orgHtml +
      '<div class="profile-stats">' +
        '<div class="ps-box"><div class="ps-num">' + total + '</div><div class="ps-lbl">Tests</div></div>' +
        '<div class="ps-box"><div class="ps-num">' + avg + '%</div><div class="ps-lbl">Avg Score</div></div>' +
        '<div class="ps-box"><div class="ps-num">' + overallAcc + '%</div><div class="ps-lbl">Accuracy</div></div>' +
        '<div class="ps-box"><div class="ps-num" style="color:' + (myRank!=='—'?'var(--green)':'var(--faint)') + ';">' + myRank + '</div><div class="ps-lbl">Org Rank</div></div>' +
      '</div>' +
      bestHtml +
    '</div>' +

    /* ── SCORE TREND ── */
    '<div class="trend-wrap">' +
      '<div class="card-head">' +
        '<span class="card-head-title">Score Trend</span>' +
        (total >= 2 ? '<span class="card-head-badge">Avg ' + avg + '%</span>' : '') +
      '</div>' +
      '<div class="card-body">' + trendHtml + '</div>' +
    '</div>' +

    /* ── SECTION ACCURACY ── */
    '<div class="trend-wrap">' +
      '<div class="card-head">' +
        '<span class="card-head-title">Section Accuracy</span>' +
        (sections.length > 0 ? '<span class="card-head-badge">' + sections.length + ' topics</span>' : '') +
      '</div>' +
      '<div class="card-body">' + weakHtml + '</div>' +
    '</div>' +

    /* ── RECENT TESTS ── */
    '<div class="section-label" style="margin-bottom:12px;"><span>Recent Tests</span><div class="section-label-line"></div></div>' +
    '<div class="panel-card" style="margin-bottom:20px;">' + historyHtml + '</div>' +

    /* ── ACCOUNT ── */
    '<div class="section-label" style="margin-bottom:12px;"><span>Account</span><div class="section-label-line"></div></div>' +
    '<div class="account-card">' +
      '<div class="card-head"><span class="card-head-title">Settings</span></div>' +
      '<div class="account-body">' +
        '<div class="form-group">' +
          '<label class="form-label">Display Name</label>' +
          '<input class="form-input" id="editName" value="' + escHtml(name) + '">' +
        '</div>' +
        '<div class="form-group">' +
          '<label class="form-label">Email</label>' +
          '<input class="form-input" value="' + escHtml(user.email||'') + '" disabled style="opacity:.55;cursor:not-allowed;">' +
        '</div>' +
        '<button class="btn-primary" onclick="saveName()" style="width:100%;">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>' +
          'Save Changes' +
        '</button>' +
        adminHtml +
        '<a href="https://drive.google.com/file/d/1zap5GhZhHVZd0rx7uEvHYEqTRZGB3LLG/view?usp=drivesdk" target="_blank" class="btn-must-read">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>' +
          'Must Read Instructions' +
        '</a>' +
        '<button class="btn-report" onclick="reportProblem()">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>' +
          'Report a Problem' +
        '</button>' +
        '<button class="btn-danger" onclick="logoutUser()" style="width:100%;justify-content:center;">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>' +
          'Logout' +
        '</button>' +
      '</div>' +
    '</div>';
}

/* ── SAVE NAME ── */
async function saveName() {
  const name = document.getElementById('editName').value.trim();
  if (!name) { showToast('Name cannot be empty.', 'error'); return; }
  const user = firebase.auth().currentUser;
  try {
    await user.updateProfile({ displayName: name });
    await window.db.collection('users').doc(user.uid).update({ username: name });
    showToast('Profile updated!', 'success');
    document.getElementById('headerCaLabel').textContent = name;
    const pn = document.querySelector('.profile-name');
    if (pn) pn.textContent = name;
  } catch(e) { showToast('Error: ' + e.message, 'error'); }
}

/* ── REPORT PROBLEM ── */
function reportProblem() {
  const user    = firebase.auth().currentUser;
  const email   = user?.email || '';
  const name    = document.querySelector('.profile-name')?.textContent || '';
  const subject = encodeURIComponent('Problem Report — Good for You Test Engine');
  const body    = encodeURIComponent(
    'Hi,\n\nI would like to report a problem:\n\n[Describe your issue here]\n\n---\nReported by: ' + name + '\nEmail: ' + email + '\n'
  );
  window.location.href = 'mailto:goodforyoutest@gmail.com?subject=' + subject + '&body=' + body;
}

function viewProfileResult(resultId) {
  if (!resultId) {
    showToast('Result not found.', 'error');
    return;
  }
  sessionStorage.setItem('viewResultId', resultId);
  window.location.href = 'result.html';
}

loadProfile();
</script>
</body>
