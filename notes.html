<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<title>Notes — Good for You Test Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.notes-layout { max-width:740px; margin:0 auto; padding:32px 20px 80px; }

.notes-filter { display:flex; gap:10px; align-items:center; margin-bottom:24px; flex-wrap:wrap; }
.notes-filter select { flex:1; min-width:200px; max-width:360px; }

.note-row {
  display:flex; align-items:center; gap:14px;
  padding:14px 18px; border-bottom:1px solid var(--ivory-3);
  transition:background .15s; background:#fff;
}
.note-row:last-child { border-bottom:none; }
.note-row:hover { background:var(--green-mist); }
.note-row.folder { cursor:pointer; -webkit-tap-highlight-color:transparent; }

.note-icon {
  width:40px; height:40px; border-radius:8px; flex-shrink:0;
  background:var(--green-mist); border:1px solid var(--green-border);
  display:flex; align-items:center; justify-content:center; color:var(--green);
}
.note-info { flex:1; min-width:0; }
.note-title { font-weight:700; font-size:.9rem; color:var(--text); margin-bottom:2px; }
.note-col   { font-size:.72rem; color:var(--muted); }
.note-view-btn {
  flex-shrink:0; display:inline-flex; align-items:center; gap:6px;
  padding:8px 14px; border-radius:6px; font-size:.78rem; font-weight:600;
  background:var(--green-mist); border:1px solid var(--green-border); color:var(--green);
  text-decoration:none; transition:background .15s;
}
.note-view-btn:hover { background:rgba(26,74,46,.14); }

.note-chevron { color:var(--muted); transition:transform .25s; flex-shrink:0; }
.note-chevron.open { transform:rotate(180deg); color:var(--green); }

.note-detail { display:none; border-top:1px solid var(--ivory-3); background:var(--ivory-1,#faf8f3); }
.note-detail.visible { display:block; }
.note-unit-row {
  display:flex; align-items:center; gap:14px;
  padding:12px 18px 12px 52px; border-bottom:1px solid var(--ivory-3);
}
.note-unit-row:last-child { border-bottom:none; }
.note-unit-title { font-size:.82rem; color:var(--text); flex:1; }

.empty-state { text-align:center; padding:50px 20px; color:var(--muted); }
.empty-state .es-icon { margin-bottom:12px; display:flex; justify-content:center; color:var(--ivory-4); }

.shimmer-row {
  display:flex; align-items:center; gap:14px; padding:14px 18px;
  border-bottom:1px solid var(--ivory-3);
}
.shimmer-circle { width:40px; height:40px; border-radius:8px; background:var(--ivory-3); animation:shimmer-pulse 1.4s ease infinite; }
.shimmer-block  { height:12px; border-radius:4px; background:var(--ivory-3); animation:shimmer-pulse 1.4s ease infinite; }
@keyframes shimmer-pulse { 0%,100%{opacity:.5;}50%{opacity:1;} }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="toast-container"></div>

<header class="site-header">
  <button class="hamburger-btn" id="hamburgerBtn"><span></span><span></span><span></span></button>
  <span class="header-ca-label" id="headerCaLabel">Notes</span>
  <span class="header-pill">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    Study Notes
  </span>
</header>

<div class="page-wrap">
<div class="notes-layout">

  <div class="section-label"><span>Notes</span><div class="section-label-line"></div></div>

  <!-- Filter -->
  <div class="notes-filter">
    <select class="form-input" id="notesColumnFilter" onchange="renderNotes()">
      <option value="">All Subjects</option>
    </select>
  </div>

  <!-- List -->
  <div class="panel-card">
    <div class="panel-card-header" style="justify-content:space-between;">
      <span id="notesTableTitle">All Notes</span>
      <span id="notesCountLabel" style="font-size:.72rem;color:var(--muted);"></span>
    </div>
    <div id="notesListBody">
      <div class="shimmer-row"><div class="shimmer-circle"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;"><div class="shimmer-block" style="width:55%;"></div><div class="shimmer-block" style="width:35%;height:9px;"></div></div></div>
      <div class="shimmer-row"><div class="shimmer-circle"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;"><div class="shimmer-block" style="width:45%;"></div><div class="shimmer-block" style="width:30%;height:9px;"></div></div></div>
      <div class="shimmer-row"><div class="shimmer-circle"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;"><div class="shimmer-block" style="width:60%;"></div><div class="shimmer-block" style="width:25%;height:9px;"></div></div></div>
    </div>
  </div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script src="drawer.js"></script>
<script>
initFirebase();
initBgCanvas();
injectDrawer('notes');

let allNotes = [];
let notesGroups = [];

async function init() {
  injectHeaderUser();
  await loadNotes();
}

async function loadNotes() {
  const body = document.getElementById('notesListBody');
  try {
    allNotes = await getNotes();

    // Populate subject filter (case/whitespace-insensitive dedupe)
    const colMap = {};
    allNotes.forEach(n => {
      const c = (n.column || 'General').trim();
      colMap[c.toLowerCase()] = c;
    });
    const cols = Object.values(colMap).sort();
    const filterSel = document.getElementById('notesColumnFilter');
    filterSel.innerHTML = '<option value="">All Subjects</option>' +
      cols.map(c => `<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('');

    renderNotes();
  } catch(e) {
    body.innerHTML = '<div class="empty-state"><p>Error loading notes.</p></div>';
    console.error(e);
  }
}

function groupNotesByChapter(notes) {
  const map = {};
  notes.forEach(n => {
    const col  = (n.column || 'General').trim();
    const chap = (n.chapter || n.title || 'Untitled').trim();
    const key  = col.toLowerCase() + '|||' + chap.toLowerCase();
    if (!map[key]) map[key] = { column: col, chapter: chap, notes: [] };
    map[key].notes.push(n);
  });
  return Object.values(map);
}

function renderNotes() {
  const body   = document.getElementById('notesListBody');
  const filter = document.getElementById('notesColumnFilter').value;

  const filtered = filter
    ? allNotes.filter(n => (n.column || 'General').trim().toLowerCase() === filter.toLowerCase())
    : allNotes;

  document.getElementById('notesTableTitle').textContent = filter ? ('📘 ' + filter) : 'All Notes';

  notesGroups = groupNotesByChapter(filtered);
  document.getElementById('notesCountLabel').textContent = notesGroups.length + ' item' + (notesGroups.length !== 1 ? 's' : '');

  if (notesGroups.length === 0) {
    body.innerHTML = `
      <div class="empty-state">
        <div class="es-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
        <p>No notes available yet.</p>
      </div>`;
    return;
  }

  body.innerHTML = notesGroups.map((g, i) => {
    if (g.notes.length === 1) {
      const n = g.notes[0];
      return `
        <div class="note-row">
          <div class="note-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
          <div class="note-info">
            <div class="note-title">${escHtml(g.chapter)}</div>
            <div class="note-col">${escHtml(g.column)}</div>
          </div>
          <a href="${n.pdfUrl}" target="_blank" rel="noopener" class="note-view-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            View
          </a>
        </div>`;
    }
    return `
      <div class="note-row folder" onclick="toggleNoteFolder(${i})">
        <div class="note-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg></div>
        <div class="note-info">
          <div class="note-title">${escHtml(g.chapter)}</div>
          <div class="note-col">${escHtml(g.column)} · ${g.notes.length} units</div>
        </div>
        <svg id="note-chev-${i}" class="note-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div id="note-detail-${i}" class="note-detail">
        ${g.notes.map(n => `
          <div class="note-unit-row">
            <div class="note-unit-title">${escHtml(n.title || 'Untitled')}</div>
            <a href="${n.pdfUrl}" target="_blank" rel="noopener" class="note-view-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              View
            </a>
          </div>`).join('')}
      </div>`;
  }).join('');
}

function toggleNoteFolder(i) {
  const detail = document.getElementById('note-detail-' + i);
  const chev   = document.getElementById('note-chev-' + i);
  const open = detail.classList.contains('visible');
  detail.classList.toggle('visible', !open);
  chev.classList.toggle('open', !open);
}

init();
</script>
</body>
</html>
